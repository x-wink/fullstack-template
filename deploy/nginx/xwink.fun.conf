# ⚠️ 已废弃(2026-08):xwink.fun 域名级 server 块的所有权已转移到 playground 仓库
# (playground/deploy/nginx/conf.d/xwink.fun.conf,主站=playground 的 apps/home)。
# 本文件不再下发;保留仅作参考,本项目如需挂回 xwink.fun 走 vhost.d 片段。
# xwink.fun 域名级 server 块(主站仓库持有:主站是 location / 兜底的所有者)
# 服务器落点:/etc/nginx/conf.d/xwink.fun.conf
# 各项目的路由片段不在这里:它们放在各自仓库的 deploy/nginx/ 下,
# 部署到 /etc/nginx/vhost.d/xwink.fun/(下方 include 引入),项目自治、互不相扰。
# 变更下发(守护式,自动备份/nginx -t 校验/reload/失败回滚):
#   winkops edit /etc/nginx/conf.d/xwink.fun.conf --file deploy/nginx/xwink.fun.conf \
#     --validate 'nginx -t' --reload 'systemctl reload nginx' -c <连接配置>
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name xwink.fun 119.29.89.220;

    index index.html index.htm;
    root /www/wwwroot/xwink.fun;

    ssl_certificate /etc/nginx/certs/xwink.fun/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/xwink.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497 https://$host$request_uri;

    location ~ ^/(\.user\.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README\.md) {
        return 404;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$ {
        expires 30d;
        access_log off;
    }
    location ~ .*\.(js|css)?$ {
        expires 12h;
        access_log off;
    }

    # ── 项目路由片段:每个项目一个 .conf,由各项目仓库部署时下发 ──
    include /etc/nginx/vhost.d/xwink.fun/*.conf;

    # 主站(个人网站)兜底
    location / {
        alias /www/wwwroot/xwink.fun/website/;
        try_files $uri $uri/ $uri/index.html /index.html index.html;
    }

    access_log /var/log/nginx/xwink.fun.log;
    error_log /var/log/nginx/xwink.fun.error.log;
}
